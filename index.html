<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#05080E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Marée d'Or</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#05080E;--bg2:#0A111C;--card:#0D1521;--card2:#111B2A;--line:#1E2A3B;--line2:#162131;--ink:#ECEFF4;--muted:#8D9AAD;--gold:#D4AF5A;--gold2:#F0D48A;--gold3:#9C7A2E;--em:#14B88A;--ok:#2BC896;--okbg:rgba(20,184,138,.13);--warn:#E8B34A;--warnbg:rgba(232,179,74,.13);--bad:#F07B74;--badbg:rgba(240,112,106,.13);--accent:var(--gold);--accent2:rgba(212,175,90,.12);--navy:#0A111C;--r:12px;--serif:'Cormorant Garamond',Georgia,serif}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body{background:radial-gradient(1200px 600px at 80% -10%,rgba(20,184,138,.07),transparent 60%),radial-gradient(900px 500px at -10% 10%,rgba(212,175,90,.06),transparent 60%),var(--bg);background-attachment:fixed;min-height:100vh}
body::before{content:"";position:fixed;inset:0;background-image:var(--shells);background-size:120px 120px;opacity:.035;pointer-events:none;z-index:0}
a{color:var(--gold2)}
header.top{position:sticky;top:0;z-index:20;background:rgba(5,8,14,.86);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line2);color:var(--ink);padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;display:flex;align-items:center;gap:10px}
header.top .logo{width:36px;height:36px;border-radius:9px;flex:none;overflow:hidden}
header.top .logo img,header.top .logo svg{width:100%;height:100%;display:block;object-fit:contain}
header.top h1{font-family:var(--serif);font-size:21px;margin:0;font-weight:600;letter-spacing:.4px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--gold2);line-height:1.05}
header.top .sub{font-family:Inter,sans-serif;font-size:10px;color:var(--muted);font-weight:600;letter-spacing:1.4px;text-transform:uppercase}
header.top button{background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit;font-size:12px}
.sync{font-size:10px;padding:3px 8px;border-radius:20px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
main{position:relative;z-index:1;padding:14px 12px calc(86px + env(safe-area-inset-bottom));max-width:980px;margin:0 auto}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;background:rgba(7,11,18,.95);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-top:1px solid var(--line2);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs a{flex:1;text-align:center;padding:9px 2px 10px;color:var(--muted);text-decoration:none;font-size:10.5px;font-weight:600;letter-spacing:.2px;position:relative}
nav.tabs a svg{display:block;margin:0 auto 3px;width:21px;height:21px}
nav.tabs a.on{color:var(--gold2)}
nav.tabs a.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
h2{font-family:var(--serif);font-size:26px;font-weight:600;margin:4px 0 12px;color:var(--ink);letter-spacing:.3px}
h3{font-size:11px;margin:0 0 10px;text-transform:uppercase;letter-spacing:1.4px;color:var(--gold);font-weight:600}
.card{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 1px 0 rgba(255,255,255,.02) inset}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:520px){.grid3{grid-template-columns:1fr 1fr}}
label{display:block;font-size:11.5px;color:var(--muted);font-weight:600;margin:0 0 4px;letter-spacing:.2px}
.f{margin-bottom:10px}
input,select,textarea{width:100%;font:inherit;color:var(--ink);background:#080E17;border:1px solid var(--line);border-radius:9px;padding:9px 10px;min-height:40px}
select option,select optgroup{background:#0D1521;color:var(--ink)}
textarea{min-height:90px;resize:vertical}
input::placeholder,textarea::placeholder{color:#55627A}
input:focus,select:focus,textarea:focus{outline:1px solid var(--gold);outline-offset:0;border-color:var(--gold3)}
input[type=checkbox]{width:auto;min-height:0;accent-color:var(--gold)}
input[type=file]{padding:7px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-weight:600;font-size:13px;border-radius:9px;padding:9px 15px;border:1px solid var(--gold3);background:linear-gradient(180deg,#E9CC7E,#C79E45);color:#1A1205;cursor:pointer;text-decoration:none;min-height:40px;letter-spacing:.2px}
.btn.sec{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.acc{background:linear-gradient(180deg,#19C997,#0E9C74);border-color:#0E9C74;color:#03140E}
.btn.danger{background:transparent;color:var(--bad);border-color:rgba(240,123,116,.35)}
.btn.sm{padding:5px 11px;font-size:12px;min-height:32px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5}
.muted{color:var(--muted)}
.small{font-size:12px}
.tiny{font-size:10px;color:#5E6B80}
.gold{color:var(--gold2)}.em{color:var(--em)}
.tag{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:20px;background:transparent;color:var(--muted);border:1px solid var(--line);white-space:nowrap;letter-spacing:.2px}
.tag.ok{background:var(--okbg);color:var(--ok);border-color:transparent}
.tag.warn{background:var(--warnbg);color:var(--warn);border-color:transparent}
.tag.bad{background:var(--badbg);color:var(--bad);border-color:transparent}
.tag.acc{background:var(--accent2);color:var(--gold2);border-color:transparent}
.seg{display:flex;background:#080E17;border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px;overflow-x:auto}
.seg button{flex:1;border:0;background:transparent;font:inherit;font-weight:600;font-size:12.5px;padding:8px 6px;border-radius:7px;color:var(--muted);white-space:nowrap}
.seg button.on{background:linear-gradient(180deg,#1A2638,#141E2D);color:var(--gold2);box-shadow:0 0 0 1px var(--gold3) inset}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10.5px;text-transform:uppercase;letter-spacing:.8px;color:var(--gold);text-align:left;font-weight:600;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 6px;border-bottom:1px solid var(--line2);vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tw{overflow-x:auto;margin:0 -14px;padding:0 14px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media(min-width:700px){.kpis{grid-template-columns:repeat(4,1fr)}}
.kpi{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:12px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:12px;right:12px;top:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold3),transparent)}
.kpi .l{font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:1px}
.kpi .v{font-size:21px;font-weight:600;margin-top:4px;font-variant-numeric:tabular-nums;color:var(--gold2)}
.kpi .d{font-size:11px;color:var(--muted);margin-top:2px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:700px){.tiles{grid-template-columns:repeat(3,1fr)}}
.tile{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);border-radius:var(--r);padding:14px;text-decoration:none;color:var(--ink);display:block;transition:border-color .2s}
.tile:active,.tile:hover{border-color:var(--gold3)}
.tile b{display:block;font-size:14px;margin-top:9px;font-weight:600}
.tile span{font-size:11.5px;color:var(--muted)}
.tile .ic{width:36px;height:36px;border-radius:9px;background:var(--accent2);color:var(--gold2);display:flex;align-items:center;justify-content:center;border:1px solid rgba(212,175,90,.25)}
.tile .ic svg{width:19px;height:19px}
.list .it{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line2)}
.list .it:last-child{border-bottom:0}
.list .it .t{font-weight:600}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:15px;margin-bottom:4px}
.banner{border-radius:var(--r);padding:11px 13px;margin-bottom:12px;font-size:13px;border:1px solid}
.banner.warn{background:var(--warnbg);border-color:rgba(232,179,74,.3);color:#F3D59A}
.banner.info{background:rgba(212,175,90,.07);border-color:rgba(212,175,90,.25);color:#E6D6AE}
.banner.bad{background:var(--badbg);border-color:rgba(240,123,116,.3);color:#F6B4AF}
.banner.ok{background:var(--okbg);border-color:rgba(20,184,138,.3);color:#9BE7CC}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--muted);text-decoration:none;font-weight:600;font-size:12.5px;margin-bottom:6px}
.verdict{border-radius:var(--r);padding:14px;font-weight:700;font-size:15px;display:flex;align-items:center;gap:10px;border:1px solid}
.verdict.ok{background:var(--okbg);color:var(--ok);border-color:rgba(20,184,138,.35)}
.verdict.warn{background:var(--warnbg);color:var(--warn);border-color:rgba(232,179,74,.35)}
.verdict.bad{background:var(--badbg);color:var(--bad);border-color:rgba(240,123,116,.35)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px}
.kv:last-child{border-bottom:0}
.kv b{font-variant-numeric:tabular-nums}
.kv.tot{font-size:15px;border-top:1px solid var(--gold3);border-bottom:0;margin-top:4px;padding-top:9px}
.kv.tot b{color:var(--gold2)}
.steps{counter-reset:s;list-style:none;padding:0;margin:0}
.steps li{counter-increment:s;position:relative;padding:0 0 14px 38px}
.steps li:before{content:counter(s);position:absolute;left:0;top:0;width:26px;height:26px;border-radius:50%;border:1px solid var(--gold3);color:var(--gold2);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center}
.steps li b{display:block}
.timeline{border-left:1px solid var(--gold3);margin-left:6px;padding-left:14px}
.timeline div{position:relative;padding-bottom:10px}
.timeline div:before{content:"";position:absolute;left:-19px;top:5px;width:9px;height:9px;border-radius:50%;background:var(--gold)}
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--card);border:1px solid var(--line);width:100%;max-width:660px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom))}
@media(min-width:700px){.modal-bg{align-items:center}.modal{border-radius:16px}}
.modal h2{display:flex;justify-content:space-between;align-items:center;gap:10px}
.x{border:1px solid var(--line);background:transparent;width:32px;height:32px;border-radius:50%;font-size:18px;line-height:1;color:var(--muted);flex:none}
#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#141E2D;border:1px solid var(--gold3);color:var(--ink);padding:10px 16px;border-radius:10px;font-size:13px;font-weight:500;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.on{opacity:1}
.up{color:var(--ok);font-weight:600}.down{color:var(--bad);font-weight:600}
.doc{background:#fff;border:1px solid #ddd;padding:18px;font-size:12px;color:#111;border-radius:6px}
.doc th{color:#555;border-bottom-color:#ddd}.doc td{border-bottom-color:#eee}.doc .kv{border-bottom-color:#e4e4e4}.doc .kv.tot{border-top-color:#0B1F33}.doc .kv.tot b{color:#111}
.chart{width:100%;height:auto}
.hr{height:1px;background:var(--line);margin:12px 0}
.pill-filter{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.pill-filter button{flex:none;border:1px solid var(--line);background:transparent;border-radius:20px;padding:6px 12px;font:inherit;font-size:12px;font-weight:600;color:var(--muted)}
.pill-filter button.on{background:var(--accent2);color:var(--gold2);border-color:var(--gold3)}
.login{max-width:360px;margin:30px auto}
.code-in{font-size:22px;letter-spacing:8px;text-align:center}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:#3A475B}
.dot.live{background:var(--em);box-shadow:0 0 0 3px rgba(20,184,138,.25)}
/* Bandeau animé */
.hero{position:relative;border-radius:16px;overflow:hidden;border:1px solid var(--line);margin-bottom:14px;height:210px;background:#060A12}
.hero svg.sea{position:absolute;inset:0;width:100%;height:100%}
.hero .title{position:absolute;left:16px;top:14px;right:120px;z-index:2}
.hero .title .n{font-family:var(--serif);font-size:30px;font-weight:600;color:var(--gold2);line-height:1;letter-spacing:.5px;text-shadow:0 2px 12px rgba(0,0,0,.6)}
.hero .title .s{font-size:10.5px;letter-spacing:2.2px;text-transform:uppercase;color:#B9C3D2;margin-top:6px}
.hero .date{position:absolute;top:12px;right:14px;font-size:11px;color:#B9C3D2;letter-spacing:.6px;z-index:2}
@keyframes waveL{from{transform:translateX(0)}to{transform:translateX(-400px)}}
@keyframes waveR{from{transform:translateX(-400px)}to{transform:translateX(0)}}
@keyframes sail{from{transform:translateX(-180px)}to{transform:translateX(980px)}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.2deg)}50%{transform:translateY(2.5px) rotate(1.2deg)}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:.9}}
.w1{animation:waveL 14s linear infinite}.w2{animation:waveR 22s linear infinite}.w3{animation:waveL 30s linear infinite}
.b1{animation:sail 46s linear infinite;animation-delay:-14s}.b2{animation:sail 64s linear infinite;animation-delay:-40s}.b3{animation:sail 82s linear infinite;animation-delay:-70s}
.bob{animation:bob 4.6s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 90%}
.star{animation:twinkle 5s ease-in-out infinite}
/* Consommables */
.part{display:grid;grid-template-columns:108px 1fr;gap:12px}
.part .ph{width:108px;height:108px;border-radius:10px;border:1px solid var(--line);background:#080E17;overflow:hidden;display:flex;align-items:center;justify-content:center;position:relative}
.part .ph img{width:100%;height:100%;object-fit:cover}
.part .ph svg{width:72%;height:72%}
.spec{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:12px;margin-top:6px}
.spec dt{color:var(--muted)}.spec dd{margin:0}
.cmp{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}
.cmp div{background:#080E17;border:1px solid var(--line2);border-radius:9px;padding:8px}
.cmp .l{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px}
.cmp .v{font-weight:600;font-size:14px;margin-top:2px;font-variant-numeric:tabular-nums}
/* Calendrier */
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;margin-top:6px}
.months span{height:7px;border-radius:2px;background:#152032}
.months span.on{background:linear-gradient(180deg,var(--gold2),var(--gold3))}
.months span.cl{background:rgba(240,123,116,.45)}
.months span.cur{outline:1px solid var(--em)}
.mlabels{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;font-size:8.5px;color:var(--muted);text-align:center;margin-top:2px}
.ornament{display:flex;align-items:center;gap:10px;color:var(--gold3);font-size:10px;letter-spacing:2px;text-transform:uppercase;margin:16px 0 10px}
.ornament::before,.ornament::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold3),transparent)}
.mapbox{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#060C15}
.map{display:block;width:100%;height:auto;touch-action:manipulation}
.map .land{fill:#1F3249;stroke:#D4AF5A;stroke-width:.9;stroke-linejoin:round}
.map .land2{fill:#172536;stroke:#7A6A3E;stroke-width:.6}
.map .grid{stroke:#D4AF5A;stroke-opacity:.07;stroke-width:.6}
.map .zone{fill:rgba(20,184,138,.16);stroke:#14B88A;stroke-width:1;stroke-dasharray:3 2}
.map .zone.sel{fill:rgba(212,175,90,.22);stroke:#F0D48A;stroke-width:1.6;stroke-dasharray:none}
.map .zl{fill:#CFE9DF;font-family:Inter,sans-serif;font-weight:600;text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:#060C15;stroke-width:2.4px}
.map .cd{fill:#F0D48A;stroke:#060C15;stroke-width:.8}
.map .cl{fill:#E6D6AE;font-family:Inter,sans-serif;paint-order:stroke;stroke:#060C15;stroke-width:2px}
.map .hv{fill:#14B88A;font-family:Inter,sans-serif;font-weight:700;paint-order:stroke;stroke:#060C15;stroke-width:2px}
button.tag{font:inherit;font-size:11px;font-weight:600;cursor:pointer;padding:4px 10px}
[data-href],[data-act]{cursor:pointer}
tr[data-act]:active td{background:rgba(212,175,90,.06)}
</style>
</head>
<body>
<header class="top" id="hdr"></header>
<main id="app"></main>
<nav class="tabs" id="tabs"></nav>
<div id="toast"></div>
<div id="modal-root"></div>

<script>
"use strict";
/* ============ Utilitaires ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-5);
const num=v=>{if(typeof v==='number')return isFinite(v)?v:0;const n=parseFloat(String(v??'').replace(/\s| /g,'').replace(',','.'));return isFinite(n)?n:0};
const eur=n=>(isFinite(n)?n:0).toLocaleString('fr-FR',{style:'currency',currency:'EUR'});
const fmt=(n,d=2)=>(isFinite(n)?n:0).toLocaleString('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d});
const todayISO=()=>new Date().toISOString().slice(0,10);
const addDays=(iso,d)=>{const t=new Date(iso+'T12:00:00');t.setDate(t.getDate()+Math.round(d));return t.toISOString().slice(0,10)};
const frDate=iso=>{if(!iso)return '—';const t=new Date(iso.length<=10?iso+'T12:00:00':iso);return isNaN(t)?iso:t.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'})};
const frDT=ts=>ts?new Date(ts).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):'—';
const q=s=>encodeURIComponent(s);
const gsearch=s=>'https://www.google.com/search?q='+q(s);
const gmaps=s=>'https://www.google.com/maps/search/?api=1&query='+q(s);
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('on'),2600)}
async function copyText(t){try{await navigator.clipboard.writeText(t);toast('Copié dans le presse-papiers')}catch(e){openModal('Copier le texte',`<p class="small muted">La copie automatique est bloquée : sélectionnez et copiez le texte.</p><textarea style="min-height:260px">${esc(t)}</textarea>`)}}
async function sha(s){try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}catch(e){let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))|0;return 'x'+h}}

function normalizeRows(j,map){

  if(Array.isArray(j.avant)||Array.isArray(j.apres)){arr=[...(j.avant||[]).map(x=>({...x,phase:'avant'})),...(j.apres||j['après']||[]).map(x=>({...x,phase:'apres'}))]}
  else arr=j.data||j.results||j.lots||j.ventes||j.items||[];
 }
 const m=Object.assign({espece:'espece',calibre:'calibre',qualite:'qualite',kg:'quantite_kg',prix:'prix_kg',min:'prix_min',max:'prix_max',phase:'phase',bateau:'bateau'},map||{});
 return arr.map(o=>({espece:String(o[m.espece]??o.espece??o.species??'').trim(),calibre:o[m.calibre]??'',qualite:o[m.qualite]??'',kg:num(o[m.kg]??o.kg??o.quantite),prix:num(o[m.prix]??o.prix),min:num(o[m.min]),max:num(o[m.max]),bateau:o[m.bateau]??'',phase:/av|apport|pre|pré/i.test(String(o[m.phase]??''))?'avant':(String(o[m.phase]??'')?'apres':(num(o[m.prix]??o.prix)>0?'apres':'avant'))})).filter(r=>r.espece);
}
function applyRows(cid,rows,source,mode='replace'){
 const R=S.results[cid]||{avant:[],apres:[],history:{},updated:0,source:''};
 rows.forEach(r=>{if(r.phase!=='avant'&&r.phase!=='apres')r.phase=r.prix>0?'apres':'avant'});
 const av=rows.filter(r=>r.phase==='avant'),ap=rows.filter(r=>r.phase==='apres');
 if(mode==='replace'){if(av.length)R.avant=av;if(ap.length)R.apres=ap}else{R.avant=[...R.avant,...av];R.apres=[...R.apres,...ap]}
 R.updated=Date.now();R.source=source;
 const d=todayISO(),agg={};
 for(const r of R.apres){if(!r.prix)continue;const a=agg[r.espece]||(agg[r.espece]={v:0,k:0,n:0});const w=r.kg||1;a.v+=r.prix*w;a.k+=w}
 R.history=R.history||{};R.history[d]={};for(const e in agg)R.history[d][e]=+(agg[e].v/agg[e].k).toFixed(2);
 const ds=Object.keys(R.history).sort();while(ds.length>45)delete R.history[ds.shift()];
 S.results[cid]=R;publishResults(cid);
}
function prevPrice(R,esp){const ds=Object.keys(R.history||{}).sort();const t=todayISO();for(let i=ds.length-1;i>=0;i--){if(ds[i]<t&&R.history[ds[i]][esp])return R.history[ds[i]][esp]}return null}
async function fetchCriee(cid,silent){

 let url=c.apiUrl,headers={'Accept':'application/json'};
 if(!url&&st.serverUrl){url=st.serverUrl.replace(/\/$/,'')+'/criees/'+cid;if(st.serverKey)headers['Authorization']='Bearer '+st.serverKey}
 if(!url)throw new Error("Aucune API configurée pour cette criée");
 if(c.apiKey){const mode=c.authMode||'bearer';if(mode==='bearer')headers['Authorization']='Bearer '+c.apiKey;else if(mode==='header')headers[c.keyName||'X-API-Key']=c.apiKey;else if(mode==='query')url+=(url.includes('?')?'&':'?')+(c.keyName||'key')+'='+q(c.apiKey)}
 let r;try{r=await fetch(url,{headers})}catch(e){throw new Error("Connexion impossible. Si l'appli est ouverte dans claude.ai, la sécurité de la page bloque les appels externes : utilisez la version installée autonome, ou l'import CSV.")}
 if(!r.ok)throw new Error('Réponse HTTP '+r.status+' de la source');
 const j=await r.json();let map={};try{if(c.map)map=JSON.parse(c.map)}catch(e){}
 const rows=normalizeRows(j,map);if(!rows.length)throw new Error('Réponse reçue mais aucune ligne reconnue (vérifiez le mapping des champs)');
 applyRows(cid,rows,'API');c.lastOk=Date.now();c.lastErr='';S.criees[cid]=c;save('criees');if(!silent)toast(rows.length+' lignes reçues');
}

function parseCSV(txt){
 txt=txt.replace(/^﻿/,'').trim();if(!txt)return[];
 const lines=txt.split(/\r?\n/).filter(l=>l.trim());const h=lines[0];
 const delim=[';','\t',','].map(d=>[d,h.split(d).length]).sort((a,b)=>b[1]-a[1])[0][0];
 const split=l=>{const out=[];let cur='',inq=false;for(let i=0;i<l.length;i++){const ch=l[i];if(ch==='"'){if(inq&&l[i+1]==='"'){cur+='"';i++}else inq=!inq}else if(ch===delim&&!inq){out.push(cur);cur=''}else cur+=ch}out.push(cur);return out.map(s=>s.trim())};
 const hd=split(h).map(s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,''));
 const find=re=>hd.findIndex(x=>re.test(x));
 const ix={espece:find(/esp|produit|nom|species/),calibre:find(/cal/),qualite:find(/qual|fraich|pres/),kg:find(/qt|quant|kg|poids|volume|tonn/),prix:find(/moy|^pm|prix(?!.*(min|max))|€/),min:find(/min/),max:find(/max/),phase:find(/phase|type|etape/),bateau:find(/bateau|navire|nav/)};
 if(ix.espece<0)ix.espece=0;
 return lines.slice(1).map(l=>{const c=split(l);const g=k=>ix[k]>=0?c[ix[k]]:'';const ph=g('phase');return{espece:g('espece'),calibre:g('calibre'),qualite:g('qualite'),kg:num(g('kg')),prix:num(g('prix')),min:num(g('min')),max:num(g('max')),bateau:g('bateau'),phase:ph?(/av|apport|pre/i.test(ph)?'avant':'apres'):null}}).filter(r=>r.espece);
}

/* ============ Calculs ============ */
function hav(a,b){const R=6371,t=x=>x*Math.PI/180;const dl=t(b[0]-a[0]),dn=t(b[1]-a[1]);const h=Math.sin(dl/2)**2+Math.cos(t(a[0]))*Math.cos(t(b[0]))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function transportCalc(p){
 const st=S.settings;const g=k=>p[k]!==undefined&&p[k]!==''?num(p[k]):num(st[k]);
 let km=num(p.km);if(!km&&CITIES[p.from]&&CITIES[p.to])km=Math.round(hav(CITIES[p.from],CITIES[p.to])*g('routeFactor'));
 const trips=p.ar?2:1,dist=km*trips;
 const hours=dist/g('speed')+g('loadMin')/60*(p.ar?2:1);
 const liters=dist*g('conso')/100,fuel=liters*g('fuelPrice');
 const tolls=dist*g('autorouteShare')/100*g('peageKm');
 const driver=hours*g('driverRate'),frigo=hours*g('frigoH'),wear=dist*g('vehicleKm');
 const total=fuel+tolls+driver+frigo+wear;const kg=num(p.kg);
 return{km,dist,hours,liters,fuel,tolls,driver,frigo,wear,total,perKg:kg?total/kg:0,perKm:dist?total/dist:0};
}
const hhmm=h=>{const m=Math.round(h*60);return Math.floor(m/60)+' h '+String(m%60).padStart(2,'0')};
function docTotals(lines){const by={};let ht=0;for(const l of lines||[]){const t=num(l.qty)*num(l.pu);ht+=t;const r=num(l.tva);by[r]=(by[r]||0)+t}let tva=0;const rates=Object.keys(by).map(r=>{const v=by[r]*num(r)/100;tva+=v;return{rate:+r,base:by[r],tva:v}});return{ht,tva,ttc:ht+tva,rates}}
function nextNum(type){const y=new Date().getFullYear();const k=type==='facture'?'nextF':'nextD';const st=S.settings;st[k]=st[k]||{};const pre=(type==='facture'?'F':'D')+y+'-';const used=S.docs.filter(d=>(d.num||'').startsWith(pre)).map(d=>parseInt(d.num.slice(pre.length))||0);const n=Math.max(st[k][y]||0,...used,0)+1;st[k][y]=n;save('settings');return (type==='facture'?'F':'D')+y+'-'+String(n).padStart(4,'0')}
function importCalc(p){
 const st=S.settings;const qty=Math.max(1,num(p.qty));const cur=p.cur||'USD';const rate=cur==='EUR'?1:cur==='CNY'?num(p.cnyEur||st.cnyEur):num(p.usdEur||st.usdEur);
 const goods=num(p.unit)*qty*rate+num(p.tooling)*rate;
 const quotes=(p.quotes||[]).filter(x=>x&&num(x.cost)>0).map(x=>{
  const freight=num(x.cost);const ins=(goods+freight)*num(p.insurance??st.insurance)/100;const cif=goods+freight+ins;
  const duty=cif*num(p.duty??st.duty)/100;const vat=(cif+duty)*num(p.vat??st.vatImport)/100;
  const landed=cif+duty+num(p.customsFee??st.customsFee)+num(p.post);const unit=landed/qty;
  const eu=num(p.euPrice);const saving=eu?(eu-unit)*qty:0;const pct=eu?(eu-unit)/eu*100:0;
  return{...x,freight,ins,cif,duty,vat,landed,unit,saving,pct};
 });
 return{goods,quotes};
}
function riskWindows(fromISO,toISO){
 const out=[];const y0=+fromISO.slice(0,4)-1,y1=+toISO.slice(0,4)+1;
 for(let y=y0;y<=y1;y++){if(CNY[y])out.push({label:'Nouvel An chinois (usines fermées)',from:addDays(CNY[y],-21),to:addDays(CNY[y],21),add:21});out.push({label:'Golden Week (1–7 oct.)',from:y+'-10-01',to:y+'-10-08',add:8});out.push({label:'Haute saison maritime',from:y+'-08-01',to:y+'-10-31',add:5});out.push({label:'Saison des typhons',from:y+'-07-01',to:y+'-09-30',add:4})}
 for(const d of S.disruptions){if(d.active!==false)out.push({label:d.label+' (alerte admin)',from:d.from||'2000-01-01',to:d.to||'2100-01-01',add:num(d.days),custom:1})}
 return out.filter(w=>w.to>=fromISO&&w.from<=toISO);
}
function planOrder(needISO,prodDays,transitDays,buffer){
 // calcule à rebours la date de commande en intégrant les fenêtres de risque
 let extra=0,wins=[];
 for(let it=0;it<4;it++){
  const order=addDays(needISO,-(prodDays+transitDays+3+buffer+extra));
  wins=riskWindows(order,needISO);const e=wins.reduce((s,w)=>s+w.add,0);
  if(e===extra)break;extra=e;
 }
 const order=addDays(needISO,-(prodDays+transitDays+3+buffer+extra));
 return{order,ship:addDays(order,prodDays+Math.min(extra,21)),arrive:addDays(order,prodDays+transitDays+extra),cleared:addDays(order,prodDays+transitDays+3+extra),extra,wins};
}

function evalWatch(w){
 const ids=w.criee?[w.criee]:Object.keys(S.results);const hits=[];
 for(const id of ids){const R=S.results[id];if(!R)continue;
  if(w.kind==='apport'){for(const r of R.avant||[])if(r.espece.toLowerCase().includes(w.espece.toLowerCase()))hits.push({id,txt:fmt(r.kg,0)+' kg annoncés'})}

 }return hits;
}

function vCA(){
 const fac=S.docs.filter(d=>d.type==='facture'&&d.statut!=='annulée');const now=new Date();
 const months=[];for(let i=11;i>=0;i--){const d=new Date(now.getFullYear(),now.getMonth()-i,1);months.push(d.toISOString().slice(0,7))}
 const byM=months.map(m=>fac.filter(d=>(d.date||'').startsWith(m)).reduce((s,d)=>s+docTotals(d.lines).ht,0));
 const y=String(now.getFullYear());const caY=fac.filter(d=>(d.date||'').startsWith(y)).reduce((s,d)=>s+docTotals(d.lines).ht,0);
 const paid=fac.filter(d=>d.statut==='payée').reduce((s,d)=>s+docTotals(d.lines).ttc,0);const due=fac.filter(d=>d.statut!=='payée').reduce((s,d)=>s+docTotals(d.lines).ttc,0);
 const byC={};fac.forEach(d=>{byC[d.clientId]=(byC[d.clientId]||0)+docTotals(d.lines).ht});const topC=Object.entries(byC).sort((a,b)=>b[1]-a[1]).slice(0,8);
 const byP={};fac.forEach(d=>(d.lines||[]).forEach(l=>{if(!/transport/i.test(l.desc)){const k=l.desc||'—';const o=byP[k]||(byP[k]={v:0,q:0});o.v+=l.qty*l.pu;if((l.unit||'').toLowerCase()==='kg')o.q+=l.qty}}));const topP=Object.entries(byP).sort((a,b)=>b[1].v-a[1].v).slice(0,8);

 return back()+`<h2>Chiffre d'affaires</h2><div class="kpis"><div class="kpi" data-href="#adm-devis"><div class="l">CA ${y} HT</div><div class="v">${eur(caY)}</div></div><div class="kpi" data-href="#adm-devis"><div class="l">Mois en cours HT</div><div class="v">${eur(byM[11])}</div></div><div class="kpi" data-href="#adm-devis"><div class="l">Encaissé TTC</div><div class="v">${eur(paid)}</div></div><div class="kpi" data-href="#adm-devis"><div class="l">À encaisser TTC</div><div class="v">${eur(due)}</div></div></div>

}

function trawler(){return `<path d="M0 30 L7 41 L84 41 L95 26 L73 27 L73 19 L61 19 L61 9 L45 9 L45 19 L12 19 L12 27 L0 27 Z" fill="url(#gb)"/><path d="M53 9 V-8 M53 -3 L33 17 M53 -3 L72 17 M13 19 L5 1 L21 19" stroke="url(#gb)" stroke-width="1.5" fill="none"/><rect x="48" y="12" width="5" height="3" fill="#05080E" opacity=".75"/><rect x="55" y="12" width="3.5" height="3" fill="#05080E" opacity=".75"/><path d="M-6 39 h-14 M-4 36 h-9" stroke="#F0D48A" stroke-width=".8" opacity=".5"/>`}
function heroSVG(){
 const wave=(y,amp,len,cls,op,stroke)=>{let d=`M0 ${y}`;for(let x=0;x<1600;x+=len)d+=` q${len/4} ${-amp} ${len/2} 0 t${len/2} 0`;return `<g class="${cls}"><path d="${d} V230 H0 Z" fill="url(#gw)" opacity="${op}"/><path d="${d}" fill="none" stroke="#D4AF5A" stroke-width="${stroke}" opacity=".55"/></g>`};
 const stars=[[60,22],[140,48],[230,18],[330,40],[420,14],[510,52],[600,26],[690,44],[760,16],[380,70],[90,80],[700,84]].map(([x,y],i)=>`<circle class="star" style="animation-delay:${-i*.7}s" cx="${x}" cy="${y}" r="${i%3?0.9:1.4}" fill="#F0D48A"/>`).join('');
 const boat=(cls,y,s,op)=>`<g class="${cls}"><g transform="translate(0,${y}) scale(${s})" opacity="${op}"><g class="bob">${trawler()}</g></g></g>`;

function worldCalc(src){
 const qty=Math.max(1,num(src.qty));const st=S.settings;
 return (src.offers||[]).filter(o=>num(o.price)>0).map(o=>{const C=COUNTRIES.find(x=>x.c===o.country)||{q:3,eu:0,duty:null,days:30};
  const q5=num(o.q)||C.q;const duty=o.duty!==''&&o.duty!=null?num(o.duty):(C.duty==null?num(st.duty):C.duty);
  const fr=num(o.freight)/qty;const base=num(o.price)+fr;const ins=base*num(st.insurance)/100;const d=(base+ins)*duty/100;const fee=C.eu?0:num(st.customsFee)/qty;
  const landed=base+ins+d+fee;const adj=landed*(1+(5-q5)*0.06);
  return{...o,C,q5,duty,landed,adj,days:num(o.days)||C.days}}).sort((a,b)=>a.adj-b.adj);
}

function mapSVG(){
 const f=sub.mapSp||'';const vb=VIEWS[sub.mapView||'france'];const s=vb[2]/700;
 const land=['fr','uk','es','be','co','it'].map(k=>`<path d="${polyD(COAST[k])}" class="${k==='fr'||k==='co'?'land':'land2'}"/>`).join('')+COAST.isl.map(([la,lo,rx,ry])=>{const [x,y]=mp(la,lo);return `<ellipse cx="${x}" cy="${y}" rx="${rx*MAP.c*MAP.k}" ry="${ry*MAP.k}" class="land"/>`}).join('');
 let grid='';for(let lo=-6;lo<=10;lo+=2){const [x]=mp(46,lo);grid+=`<line x1="${x}" y1="0" x2="${x}" y2="700" class="grid"/>`}for(let la=42;la<=51;la+=1){const [,y]=mp(la,0);grid+=`<line x1="0" y1="${y}" x2="800" y2="${y}" class="grid"/>`}
 const zones=FZONES.map(z=>{const [x,y]=mp(z.lat,z.lon);const on=!f||z.sp.includes(f);const sel=sub.mapZone===z.id;return `<g data-act="mapzone" data-id="${z.id}" style="cursor:pointer" opacity="${on?1:.15}"><ellipse cx="${x}" cy="${y}" rx="${z.rx*MAP.c*MAP.k}" ry="${z.ry*MAP.k}" class="zone ${sel?'sel':''}"/><text x="${x}" y="${y+3}" class="zl" font-size="${Math.max(6,10*s)}">${esc(z.n.split(' – ')[0].split(' (')[0])}</text></g>`}).join('');

function speciesFromLabel(t){t=(t||'').toLowerCase();return (SPECIES.find(s=>t.includes(s.n.split(/[ (/]/)[0].toLowerCase()))||{}).n}

async function saveFile(name,data,type){
 if(DL){try{await DL.save({filename:name,data});return}catch(e){try{await DL.save({filename:name,data:new Blob([data],{type})});return}catch(e2){toast('Téléchargement annulé');return}}}
 try{const u=URL.createObjectURL(new Blob([data],{type}));const a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),4000);toast('Fichier téléchargé')}catch(e){copyText(data)}
}
function etaFor(o){if(!o.transport||!o.shipDate)return '';const [h,m]=(o.shipTime||'06:00').split(':').map(Number);const d=new Date(o.shipDate+'T00:00:00');const one=o.transport.km/num(S.settings.speed)+num(S.settings.loadMin)/60;d.setHours(h,m+Math.round(one*60));return d.toISOString()}

 watch:(f,fd)=>{sub.alertSp='';S.watch.push({id:uid(),espece:fd.get('espece').trim(),kind:fd.get('kind'),sens:fd.get('sens'),seuil:num(fd.get('seuil')),criee:fd.get('criee')});save('watch');render()},

 world:(f,fd)=>{S.sourcing=Object.assign({offers:[]},S.sourcing,{item:fd.get('item'),qty:num(fd.get('qty'))||1,ref:fd.get('ref')});save('sourcing');render()},
 offer:(f,fd)=>{S.sourcing=Object.assign({qty:100,offers:[]},S.sourcing);S.sourcing.offers=S.sourcing.offers||[];S.sourcing.offers.push({country:fd.get('country'),supplier:fd.get('supplier'),price:fd.get('price'),freight:fd.get('freight'),days:fd.get('days'),q:fd.get('q'),duty:fd.get('duty')});save('sourcing');render()},
 noop:()=>{}
};
async function readImage(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{if(file.type==='image/svg+xml'){res(fr.result);return}const img=new Image();img.onload=()=>{const s=256,c=document.createElement('canvas');const k=Math.min(s/img.width,s/img.height,1);c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);res(c.toDataURL('image/png'))};img.onerror=rej;img.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}

/* ============ Événements ============ */
document.addEventListener('click',ev=>{
 if(ev.target.closest('input,select,textarea,label'))return;
 const hr=ev.target.closest('[data-href]');if(hr&&!ev.target.closest('[data-act]')){location.hash=hr.dataset.href;return}
 const row=ev.target.closest('.it');if(row&&!ev.target.closest('[data-act],a,button')){const b=[...row.querySelectorAll('button[data-act]')].find(x=>!x.classList.contains('danger'));if(b){b.click();return}}
 const el=ev.target.closest('[data-act]');if(!el)return;const fn=A[el.dataset.act];if(!fn)return;if(el.tagName==='BUTTON'||el.tagName==='A'&&el.dataset.act!=='opencriee')ev.preventDefault?.();fn(el,ev)});
document.addEventListener('submit',ev=>{const f=ev.target;if(!f.dataset.form)return;ev.preventDefault();const fn=FORMS[f.dataset.form];if(fn)fn(f,new FormData(f))});
document.addEventListener('change',async ev=>{const el=ev.target;
 if(el.dataset.change==='criee'&&view==='resultats'){sub.criee=el.value;render();return}
 if(el.dataset.change==='calall'){sub.calAll=el.checked;render();return}
 if(el.dataset.change==='mapsp'){sub.mapSp=el.value;sub.mapZone='';render();return}
 if(el.dataset.change==='cstatus'){const c=S.criees[el.dataset.id]=S.criees[el.dataset.id]||{};c.status=el.value;save('criees');render();return}
 if(el.dataset.change==='docstat'){const d=S.docs.find(x=>x.id===el.dataset.id);d.statut=el.value;save('docs');render();toast('Statut : '+el.value);return}
 if(el.dataset.conso){const p=S.consoPrices[el.dataset.conso]=S.consoPrices[el.dataset.conso]||{};p[el.dataset.k]=el.value;save('consoPrices');render();return}
 if(el.dataset.file==='logo'&&el.files[0]){try{S.settings.logo=await readImage(el.files[0]);save('settings');toast('Logo mis à jour');render()}catch(e){toast('Image illisible')}return}
 if(el.dataset.file==='cphoto'&&el.files[0]){try{const p=S.consoPrices[el.dataset.id]=S.consoPrices[el.dataset.id]||{};p.photo=await readImage(el.files[0]);save('consoPrices');render()}catch(e){toast('Image illisible')}return}
 if(el.dataset.file==='csv'&&el.files[0]){$('#csv-'+el.dataset.id).value=await el.files[0].text();return}
 if(el.dataset.file==='json'&&el.files[0]){$('#restore-json').value=await el.files[0].text();return}
 if(el.dataset.live==='ship')liveShip();if(el.dataset.live==='china')liveChina();
});
document.addEventListener('input',ev=>{const el=ev.target;
 if(el.dataset.input){sub[el.dataset.input]=el.value;const pos=el.selectionStart;render();const n=document.querySelector(`[data-input="${el.dataset.input}"]`);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}return}
 if(el.dataset.live==='ship')liveShip();if(el.dataset.live==='china'){clearTimeout(liveChina._t);liveChina._t=setTimeout(liveChina,250)}
});
window.addEventListener('hashchange',()=>{if(location.hash!=='#adm-criees')sub.crieeDetail=null;closeModal();render();window.scrollTo(0,0)});
if('serviceWorker' in navigator&&location.protocol==='https:'&&!location.hostname.includes('claude')){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
document.addEventListener('error',ev=>{const t=ev.target;if(t&&t.tagName==='IMG'&&t.dataset.fb&&ILLUS[t.dataset.fb]){const d=document.createElement('div');d.style.cssText='width:72%;height:72%';d.innerHTML=ILLUS[t.dataset.fb];t.replaceWith(d)}},true);
try{const shell=LOGO_SVG.match(/<path d="([^"]+)" fill="url\(#lg\)"/)[1];document.body.style.setProperty('--shells',`url("data:image/svg+xml,${encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120"><g fill="none" stroke="#D4AF5A" stroke-width="1"><path transform="translate(4 4) scale(.8)" d="'+shell+'"/><path transform="translate(64 62) scale(.7)" d="'+shell+'"/></g><path d="M0 100 q15 -6 30 0 t30 0 t30 0 t30 0" fill="none" stroke="#14B88A" stroke-width=".8"/></svg>')}")`)}catch(e){}
render();initStore();
